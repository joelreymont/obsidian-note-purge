name: Release

# Publishes a release with the files Obsidian and BRAT install (main.js,
# manifest.json, styles.css) for the version in manifest.json, with signed
# build provenance for each file. Run it from the Actions tab, or push a tag
# equal to that version (e.g. 1.0.1).
on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No dependency cache in a job that can sign and publish releases.
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Read the version from manifest.json
        run: echo "VERSION=$(node -p 'require("./manifest.json").version')" >> "$GITHUB_ENV"
      - name: Check a pushed tag matches manifest.json
        if: github.ref_type == 'tag'
        run: test "$VERSION" = "$GITHUB_REF_NAME"
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" main.js manifest.json styles.css --title "$VERSION" --target "$GITHUB_SHA" --generate-notes
